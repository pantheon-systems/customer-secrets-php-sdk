# This file is managed by github-terraform. Manual changes will be overwritten.
# To modify it, edit orgs/pantheon-systems/files/dependabot/custom/customer-secrets-php-sdk.yml
# in https://github.com/pantheon-systems/github-terraform
version: 2
# Every version update lands in one weekly PR (multi-ecosystem group `dependencies`).
# Security updates are not part of the group; each opens as its own PR.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependencies


  - package-ecosystem: "composer"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependencies


  - package-ecosystem: "composer"
    directory: "/.scenarios.lock/php8.1"
    patterns: ["*"]
    multi-ecosystem-group: dependencies


  - package-ecosystem: "composer"
    directory: "/.scenarios.lock/php8.2"
    patterns: ["*"]
    multi-ecosystem-group: dependencies
